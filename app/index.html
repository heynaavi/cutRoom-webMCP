<title>Cutroom — find the short inside the hour | WebMCP podcast editor</title>
<meta name="description" content="Cutroom is a WebMCP-enabled web app for cutting podcast shorts. It exposes its editing tools to AI agents through document.modelContext, so an agent can search a 38-minute transcript, propose a complete cut from non-contiguous spans, reorder clips, and play the result out loud — while the person keeps the taste decisions." />

<!-- Structured data: what this is, and what an agent can do here. -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "WebApplication",
      "@id": "https://cutroom-webmcp.vercel.app/#app",
      "name": "Cutroom",
      "url": "https://cutroom-webmcp.vercel.app/",
      "applicationCategory": "MultimediaApplication",
      "operatingSystem": "Any (web browser)",
      "browserRequirements": "Chrome 149+ with WebMCP enabled, or ChatGPT's browser, for agent features. Works standalone in any modern browser.",
      "description": "A WebMCP surface for cutting podcast shorts. Exposes ten tools through document.modelContext so an AI agent can search a transcript, propose complete cuts from non-contiguous spans, reorder clips, and play the result — while the person keeps the taste decisions.",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
      "license": "https://opensource.org/licenses/MIT",
      "featureList": [
        "Search a full transcript by topic, phrase, or emotion",
        "Assemble a short from non-contiguous spans anywhere in a recording",
        "Stitched playback across clips with sub-frame boundaries",
        "Agent proposals land as pending clips the person keeps or drops",
        "Visible ledger of every agent tool call",
        "Load your own media and SRT/VTT transcript entirely client-side"
      ]
    },
    {
      "@type": "SoftwareSourceCode",
      "codeRepository": "https://github.com/heynaavi/cutRoom-webMCP",
      "programmingLanguage": "JavaScript",
      "license": "https://opensource.org/licenses/MIT",
      "about": { "@id": "https://cutroom-webmcp.vercel.app/#app" }
    },
    {
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is WebMCP?",
          "acceptedAnswer": { "@type": "Answer", "text": "WebMCP is a proposed web standard that lets a website expose structured, callable tools to AI agents through document.modelContext, instead of making the agent scrape the DOM. Cutroom registers ten such tools." }
        },
        {
          "@type": "Question",
          "name": "How do I use Cutroom with an AI agent?",
          "acceptedAnswer": { "@type": "Answer", "text": "Open the page in ChatGPT's browser, or in Chrome 149+ with chrome://flags/#enable-webmcp-testing enabled. The indicator in the top bar reads '10 tools live' once registration succeeds. Then ask the agent to find and propose a cut." }
        },
        {
          "@type": "Question",
          "name": "Can I use my own podcast or recording?",
          "acceptedAnswer": { "@type": "Answer", "text": "Yes. Drop an audio or video file plus an SRT, VTT, or JSON transcript onto the page — everything is parsed in the browser and nothing is uploaded. An agent can also supply a transcript directly via the loadTranscript tool." }
        }
      ]
    }
  ]
}
</script>

<link rel="stylesheet" href="css/cutroom.css" />
</head>
<body>
<div class="shell">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">Cut<em>room</em></span>
      <span class="brand-sub">WebMCP</span>
    </div>
    <div class="src-chip" id="srcChip">
      <b id="srcTitle">Loading…</b>
      <span class="mono tnum" id="srcDur"></span>
    </div>
    <span class="spacer"></span>
    <span class="agent-dot" id="agentDot" title="WebMCP tool registration status"><i></i><span id="agentLabel">no agent</span></span>
    <button class="tbtn" id="themeBtn" title="Toggle theme">Dark</button>
  </header>

  <div class="main">
    <!-- ── LEFT: stage, transport, provenance, reel, chips ── -->
    <div class="left">
      <section class="stage">
        <div class="stage-frame"><div class="stage-card">
          <span class="stage-label">Preview</span>
          <span class="stage-clipno" id="stageClip"></span>
          <div class="caption idle" id="caption">
            Pick lines from the transcript, or let an agent propose a cut. Press <b>Space</b> to play the reel.
          </div>
          <div class="wave" id="wave"></div>
        </div></div>

        <div class="transport">
          <button class="play-btn" id="playBtn" aria-label="Play reel">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <span class="t-time tnum"><b id="tNow">0:00</b> / <span id="tTot">0:00</span></span>
          <div class="scrub" id="scrub">
            <div class="scrub-track"><div class="scrub-fill" id="scrubFill"></div></div>
            <div class="scrub-head" id="scrubHead"></div>
          </div>
        </div>

        <div class="prov">
          <div class="prov-head">Where it came from <b id="provSpread"></b></div>
          <div class="prov-bar" id="provBar"><div class="prov-play" id="provPlay"></div></div>
          <div class="prov-scale"><span>0:00</span><span id="provEnd"></span></div>
        </div>
      </section>

      <section class="reel">
        <div class="reel-head">
          <button class="cut-play" id="cutPlay" disabled title="Play the cut end to end (Space)">
            <span id="cutPlayIcon"></span><span id="cutPlayLabel">Play cut</span>
          </button>
          <div class="budget">
            <span class="budget-num tnum" id="budgetNum"><b>0s</b> / 60s</span>
            <div class="budget-bar"><div class="budget-fill" id="budgetFill"></div></div>
          </div>
          <span class="spacer"></span>
          <button class="tbtn" id="keepAllBtn" hidden>Keep all</button>
          <button class="tbtn" id="undoBtn" disabled title="Undo (⌘Z)">Undo</button>
          <button class="tbtn" id="exportBtn" disabled title="Download the cut">Export</button>
          <button class="tbtn" id="clearBtn">Clear</button>
        </div>
        <div class="strip" id="strip"></div>
      </section>

      <nav class="chips" id="chips"><span class="chips-label">Steer</span></nav>
    </div>

    <!-- ── RIGHT: transcript / starred / candidates + agent log ── -->
    <aside class="right">
      <div class="rail">
        <div class="rail-tabs" id="railTabs">
          <button class="rtab on" data-tab="transcript">Transcript<span class="count" id="cTranscript"></span></button>
          <button class="rtab" data-tab="starred">Starred<span class="count" id="cStarred"></span></button>
          <button class="rtab" data-tab="cands">Cuts<span class="count" id="cCands"></span></button>
        </div>
        <div class="search" id="searchWrap">
          <input class="search-in" id="search" placeholder="Search 38 minutes…" autocomplete="off" spellcheck="false" />
        </div>
        <div class="list" id="list"></div>
      </div>

      <div class="log">
        <div class="log-head">Agent activity</div>
        <div class="log-body" id="logBody">
          <div class="log-empty" id="logEmpty">Checking for WebMCP…</div>
        </div>
      </div>
    </aside>
  </div>
</div>

<div class="toast" id="toast"></div>
<audio id="audio" preload="auto" src="media/episode.m4a"></audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="js/store.js"></script>
<script src="js/ingest.js"></script>
<script src="js/starters.js"></script>
<script src="js/player.js"></script>
<script src="js/wave.js"></script>
<script src="js/ui.js"></script>
<script src="js/tools.js"></script>
</body>
</html>
