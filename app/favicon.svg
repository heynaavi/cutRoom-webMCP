<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Cutroom">
  <style>
    .plate { fill: #f1f0ec }
    .track { fill: #d9d8d2 }
    .bars  { fill: #c4582f }
    @media (prefers-color-scheme: dark) {
      .plate { fill: #151514 }
      .track { fill: #2b2b29 }
      .bars  { fill: #e0724a }
    }
  </style>
  <rect class="plate" width="32" height="32" rx="7"/>
  <rect class="track" x="4" y="14.5" width="24" height="3.5" rx="1.75"/>
  <g class="bars">
    <rect x="7"  y="11" width="2.6" height="10.5" rx="1.3"/>
    <rect x="13" y="9"  width="2.6" height="14"   rx="1.3"/>
    <rect x="19" y="12" width="2.6" height="8"    rx="1.3"/>
    <rect x="24" y="10" width="2.6" height="12"   rx="1.3"/>
  </g>
</svg>
